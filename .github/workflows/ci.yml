# The same gate as `cargo xtask ci`, on Linux. PhotoCraft is used by path (`../photocraft`), so
# both repositories are checked out side by side, PhotoCraft at the commit in `photocraft.rev`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
        with:
          path: photocraft-mobile

      - name: Read the tested PhotoCraft commit
        id: upstream
        run: echo "rev=$(grep -v '^#' photocraft-mobile/photocraft.rev | grep -m1 .)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: storytold/photocraft
          ref: ${{ steps.upstream.outputs.rev }}
          path: photocraft

      # The Android SDK and NDK in the image are kept: the Android crate is checked with them.
      - name: Install Linux system dependencies (egui/winit/rfd)
        run: |
          nohup sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev

      # Gradle runs the JVM tests of the Android app's Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: photocraft-mobile
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: cargo xtask ci
        working-directory: photocraft-mobile
        run: cargo xtask ci
